<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temparature converter</title>
    <link rel="stylesheet" href="temparature.css">

</head>
<body>
    
    <div id="container">
        <h1>Temperature Converter!!</h1>
        <input type="number" id="data"><br>
        <div><input type="radio" id="ctof" name="converter"><label for="ctof">Celsius --> Fahrenheit</label></div><br>
        <div><input type="radio" id="ftoc" name="converter"><label for="ftoc" >Fahrenheit --> Celcius</label></div><br>
        <button id="submit">submit</button>
        <h3 id="result"></h3>
    </div>
    <script src="temparature.js"></script>
</body> 
</html>
